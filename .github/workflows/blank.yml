
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'meu-dinheiro-app/**'
      - 'android-wrapper/**'
      - '.github/workflows/gerar-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        run: |
          echo "Verificando os arquivos do projeto"
          ls -la

      - name: Gerar APK
        run: |
          if [ -f android-wrapper/gradlew ]; then
            cd android-wrapper
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Projeto Android/Gradle não encontrado."
            echo "É necessário adicionar o projeto Android completo."
            exit 1
          fi

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meu-dinheiro-apk
          path: android-wrapper/app/build/outputs/apk/debug/*.apk
