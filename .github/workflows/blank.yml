
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: meu-dinheiro-android

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar arquivos
        run: |
          ls -la
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html

      - name: Instalar dependências
        run: npm install --include=dev

      - name: Verificar Capacitor
        run: |
          npm ls @capacitor/cli
          test -x node_modules/.bin/cap
          ./node_modules/.bin/cap --version

      - name: Verificar configuração
        run: ./node_modules/.bin/cap config

      - name: Criar projeto Android
        run: ./node_modules/.bin/cap add android

      - name: Sincronizar aplicativo
        run: ./node_modules/.bin/cap sync android

      - name: Compilar APK
        working-directory: meu-dinheiro-android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-dinheiro-apk
          path: meu-dinheiro-android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
