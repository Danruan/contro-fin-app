
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar arquivos
        run: |
          ls -la
          test -f package.json
          test -f meu-dinheiro-app/index.html

      - name: Instalar dependências
        run: npm install

      - name: Criar configuração Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.meudinheiro.app",
            "appName": "Meu Dinheiro",
            "webDir": "meu-dinheiro-app"
          }
          EOF
          cat capacitor.config.json

      - name: Verificar configuração
        run: npx cap config

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-dinheiro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
